<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUNE · Resumen de faltantes</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --magenta: #E6007E;
    --magenta-soft: #FCE4F1;
    --magenta-dark: #B00062;
    --ink: #15101A;
    --ink-soft: #6B6470;
    --bg: #F7F5F8;
    --surface: #FFFFFF;
    --line: #E8E3EC;
    --line-strong: #D4CCDA;
    --shadow: 0 1px 2px rgba(21,16,26,0.04), 0 8px 28px rgba(21,16,26,0.07);
    --r: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; padding: 0 16px 64px; }
  .wrap { max-width: 1040px; margin: 0 auto; }

  .topbar {
    padding: 22px 0 18px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 12px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-name { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.18em; color: var(--magenta); }
  .brand-sub { font-size: 12px; color: var(--ink-soft); }
  .actions { display: flex; gap: 8px; }
  .btn {
    font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
    text-decoration: none; transition: all 0.15s; font-family: 'Inter', sans-serif;
  }
  .btn:hover { border-color: var(--magenta); color: var(--magenta); }
  .btn-primary { background: var(--magenta); color: #fff; border-color: var(--magenta); }
  .btn-primary:hover { background: var(--magenta-dark); color: #fff; }

  .head { padding: 30px 0 8px; }
  .head h1 { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.02em; }
  .head p { color: var(--ink-soft); margin-top: 6px; font-size: 15px; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 24px 0; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
  .kpi .v { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.02em; line-height: 1; }
  .kpi .l { font-size: 12px; color: var(--ink-soft); margin-top: 8px; letter-spacing: 0.02em; }
  .kpi.accent .v { color: var(--magenta); }

  /* filters */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 18px; }
  .filter { display: flex; flex-direction: column; gap: 5px; }
  .filter label { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
  .filter select, .filter input {
    font-family: 'Inter', sans-serif; font-size: 13px; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); outline: none; min-width: 150px;
  }
  .filter select:focus, .filter input:focus { border-color: var(--magenta); box-shadow: 0 0 0 3px var(--magenta-soft); }
  .clear-f { font-size: 13px; color: var(--magenta); background: none; border: none; cursor: pointer; padding: 9px 4px; font-weight: 500; }

  /* tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 0; }
  .tab {
    padding: 10px 16px; font-size: 14px; font-weight: 500; color: var(--ink-soft); cursor: pointer;
    border: none; background: none; border-bottom: 2px solid transparent; font-family: 'Inter', sans-serif; transition: all 0.15s;
  }
  .tab.active { color: var(--magenta); border-bottom-color: var(--magenta); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-top: none; border-radius: 0 0 var(--r) var(--r); box-shadow: var(--shadow); overflow: hidden; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-soft); padding: 12px 16px; background: #FBFAFC; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: var(--magenta); }
  thead th .arrow { font-size: 9px; opacity: 0.5; margin-left: 3px; }
  tbody td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FBFAFC; }
  .num { font-family: 'JetBrains Mono', monospace; font-weight: 500; text-align: right; }
  .fam-tag { font-size: 11px; padding: 3px 9px; border-radius: 12px; font-weight: 500; white-space: nowrap; }
  .muted { color: var(--ink-soft); }

  .scroll { max-height: 560px; overflow: auto; }

  .empty { text-align: center; padding: 72px 24px; }
  .empty .ic { font-size: 40px; margin-bottom: 12px; }
  .empty h3 { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 18px; }
  .empty p { color: var(--ink-soft); margin-top: 6px; font-size: 14px; }
  .empty a { color: var(--magenta); text-decoration: none; font-weight: 500; }

  .bar-row { display: flex; align-items: center; gap: 12px; }
  .bar-track { flex: 1; height: 8px; background: var(--magenta-soft); border-radius: 5px; overflow: hidden; min-width: 60px; }
  .bar-fill { height: 100%; background: var(--magenta); border-radius: 5px; }

  .loading { text-align: center; padding: 60px; color: var(--ink-soft); }

  @media (max-width: 720px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .head h1 { font-size: 25px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="brand-name">TUNE</span><span class="brand-sub">Resumen consolidado</span></div>
    <div class="actions">
      <a class="btn" href="01_carga_tiendas.html">Ir a carga</a>
      <button class="btn" onclick="exportCSV()">Exportar CSV</button>
      <button class="btn" onclick="refresh()">Actualizar</button>
    </div>
  </div>

  <div class="head">
    <h1>Faltantes consolidados</h1>
    <p>Todo lo que cargan las tiendas, sumado y filtrable en un solo lugar.</p>
  </div>

  <div id="content">
    <div class="loading">Cargando datos...</div>
  </div>
</div>

<script>
const FAM_COLOR = {
  "Audio":"#DBEAFE","Energía":"#DCFCE7","Vidrios":"#FEF3C7","Varios":"#FCE7F3",
  "Periféricos":"#EDE9FE","Smartwatch":"#FFEDD5","Seguridad":"#E0F2FE"
};

// ===========================================================================
//  CONFIGURACIÓN DEL SERVIDOR
//  Pegá entre las comillas la URL de tu Apps Script (la que termina en /exec).
//  Mientras esté vacía, la página guarda los datos solo en este navegador.
// ===========================================================================
const API_URL = "https://script.google.com/macros/s/AKfycbz2uL_Dfr09cfy4OnAkOT59LwRVZmqNmSf1DdUXm0fot7moTfGLWSPSsf_Gg4PU6L7Hqg/exec";

const Backend = {
  usandoServidor(){ return !!API_URL; },

  async saveRecords(registros){
    if(API_URL){
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "add", registros: registros })
      });
      return true;
    }
    // Sin servidor: guarda en este navegador (sirve para probar)
    const ts = Date.now();
    for(let i=0;i<registros.length;i++){
      const key = `faltante:${ts}_${i}_${Math.random().toString(36).slice(2,7)}`;
      const val = JSON.stringify({ ...registros[i], creado: new Date().toISOString() });
      if (window.storage && window.storage.set) await window.storage.set(key, val, true);
      else localStorage.setItem(key, val);
    }
    return true;
  },

  async loadRecords(){
    if(API_URL){
      const resp = await fetch(API_URL + "?action=list&t=" + Date.now());
      if(!resp.ok) throw new Error("No se pudo leer del servidor (HTTP " + resp.status + ")");
      const data = await resp.json();
      return Array.isArray(data) ? data : [];
    }
    // Sin servidor: lee de este navegador
    const out = [];
    let keys = [];
    if (window.storage && window.storage.list){ const r = await window.storage.list("faltante:", true); keys = (r&&r.keys)||[]; }
    else { for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith("faltante:")) keys.push(k); } }
    for(const k of keys){
      try {
        let v;
        if (window.storage && window.storage.get){ const r = await window.storage.get(k, true); v = r&&r.value; }
        else v = localStorage.getItem(k);
        if(v){ const o = JSON.parse(v); o._key = k; out.push(o); }
      } catch(e){}
    }
    return out;
  }
};

let DATA = [];
let sortBy = 'cantidad', sortDir = 'desc';
let activeTab = 'detalle';
let filtros = { tienda:'', familia:'', desde:'', hasta:'' };

async function cargar(){
  try { DATA = await Backend.loadRecords(); }
  catch(err){ console.error(err); DATA = []; }
  render();
}

function refresh(){ document.getElementById('content').innerHTML='<div class="loading">Actualizando...</div>'; cargar(); }

function aplicarFiltros(rows){
  return rows.filter(r=>{
    if(filtros.tienda && r.tienda!==filtros.tienda) return false;
    if(filtros.familia && r.familia!==filtros.familia) return false;
    if(filtros.desde && r.fecha < filtros.desde) return false;
    if(filtros.hasta && r.fecha > filtros.hasta) return false;
    return true;
  });
}

function render(){
  const c = document.getElementById('content');
  if(!DATA.length){
    c.innerHTML = `<div class="panel" style="border-radius:var(--r);border-top:1px solid var(--line);">
      <div class="empty"><div class="ic">📭</div><h3>Todavía no hay faltantes cargados</h3>
      <p>Cuando las tiendas completen sus reportes en <a href="01_carga_tiendas.html">la página de carga</a>, vas a verlos acá.</p></div></div>`;
    return;
  }

  const rows = aplicarFiltros(DATA);
  const totalUnidades = rows.reduce((s,r)=>s+(r.cantidad||0),0);
  const tiendasActivas = new Set(rows.map(r=>r.tienda)).size;
  const productosDistintos = new Set(rows.map(r=>r.producto)).size;

  const tiendas = [...new Set(DATA.map(r=>r.tienda))].sort();
  const familias = [...new Set(DATA.map(r=>r.familia))].sort();

  c.innerHTML = `
    <div class="kpis">
      <div class="kpi accent"><div class="v">${totalUnidades.toLocaleString('es-AR')}</div><div class="l">Unidades perdidas (estimado)</div></div>
      <div class="kpi"><div class="v">${rows.length.toLocaleString('es-AR')}</div><div class="l">Registros de faltante</div></div>
      <div class="kpi"><div class="v">${tiendasActivas}</div><div class="l">Tiendas con reportes</div></div>
      <div class="kpi"><div class="v">${productosDistintos}</div><div class="l">Productos distintos</div></div>
    </div>

    <div class="filters">
      <div class="filter"><label>Tienda</label><select id="f-tienda" onchange="setF('tienda',this.value)">
        <option value="">Todas</option>${tiendas.map(t=>`<option value="${t}" ${filtros.tienda===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="filter"><label>Familia</label><select id="f-fam" onchange="setF('familia',this.value)">
        <option value="">Todas</option>${familias.map(f=>`<option value="${f}" ${filtros.familia===f?'selected':''}>${f}</option>`).join('')}</select></div>
      <div class="filter"><label>Desde</label><input type="date" id="f-desde" value="${filtros.desde}" onchange="setF('desde',this.value)"></div>
      <div class="filter"><label>Hasta</label><input type="date" id="f-hasta" value="${filtros.hasta}" onchange="setF('hasta',this.value)"></div>
      ${(filtros.tienda||filtros.familia||filtros.desde||filtros.hasta)?'<button class="clear-f" onclick="clearF()">Limpiar filtros</button>':''}
    </div>

    <div class="tabs">
      <button class="tab ${activeTab==='detalle'?'active':''}" onclick="setTab('detalle')">Detalle</button>
      <button class="tab ${activeTab==='producto'?'active':''}" onclick="setTab('producto')">Por producto</button>
      <button class="tab ${activeTab==='tienda'?'active':''}" onclick="setTab('tienda')">Por tienda</button>
    </div>
    <div class="panel" id="panel"></div>`;

  renderPanel(rows);
}

function renderPanel(rows){
  const panel = document.getElementById('panel');
  if(activeTab==='detalle') panel.innerHTML = tablaDetalle(rows);
  else if(activeTab==='producto') panel.innerHTML = tablaAgrupada(rows, 'producto', 'Producto');
  else panel.innerHTML = tablaAgrupada(rows, 'tienda', 'Tienda');
}

function th(label, key, extra=''){
  const arrow = sortBy===key ? (sortDir==='desc'?'▼':'▲') : '';
  return `<th onclick="sortCol('${key}')" ${extra}>${label}<span class="arrow">${arrow}</span></th>`;
}

function tablaDetalle(rows){
  const sorted = [...rows].sort((a,b)=>cmp(a,b));
  if(!sorted.length) return `<div class="empty"><div class="ic">🔍</div><h3>Sin resultados</h3><p>Probá ajustando los filtros.</p></div>`;
  return `<div class="scroll"><table>
    <thead><tr>${th('Fecha','fecha')}${th('Tienda','tienda')}${th('Familia','familia')}${th('Producto','producto')}${th('Modelo','modelo')}${th('Cant.','cantidad','style="text-align:right;"')}</tr></thead>
    <tbody>${sorted.map(r=>`<tr>
      <td class="muted">${(r.fecha||'').split('-').reverse().join('/')}</td>
      <td>${r.tienda||''}</td>
      <td><span class="fam-tag" style="background:${FAM_COLOR[r.familia]||'#eee'};color:#3a3340;">${r.familia||''}</span></td>
      <td>${r.producto||''}</td>
      <td class="muted">${r.modelo||'—'}</td>
      <td class="num">${r.cantidad||0}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function tablaAgrupada(rows, key, label){
  const map = {};
  rows.forEach(r=>{ const k = r[key]||'(sin dato)'; if(!map[k]) map[k]={cant:0,fam:r.familia,n:0}; map[k].cant+=(r.cantidad||0); map[k].n++; });
  let arr = Object.entries(map).map(([k,v])=>({k, ...v}));
  arr.sort((a,b)=> sortDir==='desc'? b.cant-a.cant : a.cant-b.cant);
  if(!arr.length) return `<div class="empty"><div class="ic">🔍</div><h3>Sin resultados</h3><p>Probá ajustando los filtros.</p></div>`;
  const max = Math.max(...arr.map(a=>a.cant),1);
  return `<div class="scroll"><table>
    <thead><tr><th>${label}</th>${key==='producto'?'<th>Familia</th>':''}<th>Distribución</th><th onclick="toggleDir()" style="text-align:right;cursor:pointer;">Unidades <span class="arrow">${sortDir==='desc'?'▼':'▲'}</span></th><th style="text-align:right;">Registros</th></tr></thead>
    <tbody>${arr.map(a=>`<tr>
      <td>${a.k}</td>
      ${key==='producto'?`<td><span class="fam-tag" style="background:${FAM_COLOR[a.fam]||'#eee'};color:#3a3340;">${a.fam||''}</span></td>`:''}
      <td><div class="bar-row"><div class="bar-track"><div class="bar-fill" style="width:${(a.cant/max*100).toFixed(1)}%"></div></div></div></td>
      <td class="num" style="color:var(--magenta);">${a.cant}</td>
      <td class="num muted">${a.n}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function cmp(a,b){
  let va=a[sortBy], vb=b[sortBy];
  if(sortBy==='cantidad'){ va=va||0; vb=vb||0; return sortDir==='desc'? vb-va : va-vb; }
  va=(va||'').toString().toLowerCase(); vb=(vb||'').toString().toLowerCase();
  return sortDir==='desc'? vb.localeCompare(va) : va.localeCompare(vb);
}
function sortCol(key){ if(sortBy===key) sortDir = sortDir==='desc'?'asc':'desc'; else { sortBy=key; sortDir = key==='cantidad'?'desc':'asc'; } render(); }
function toggleDir(){ sortDir = sortDir==='desc'?'asc':'desc'; render(); }
function setF(k,v){ filtros[k]=v; render(); }
function clearF(){ filtros={tienda:'',familia:'',desde:'',hasta:''}; render(); }
function setTab(t){ activeTab=t; render(); }

function exportCSV(){
  const rows = aplicarFiltros(DATA);
  if(!rows.length){ alert('No hay datos para exportar.'); return; }
  const head = ['Fecha','Tienda','Familia','Producto','Modelo','Cantidad estimada perdida'];
  const lines = [head.join(',')];
  rows.forEach(r=>{
    const cells = [r.fecha, r.tienda, r.familia, r.producto, r.modelo||'', r.cantidad||0]
      .map(x=>{ const s=(x==null?'':String(x)); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; });
    lines.push(cells.join(','));
  });
  const blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `faltantes_tune_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

cargar();
</script>
</body>
</html>
